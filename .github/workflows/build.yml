name: Build and verify PCB Workbench
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check local agent syntax
        run: node --check agent/server.mjs && node --check agent/engine.mjs && node --check agent/bridge.mjs
      - name: Install circuit engine
        run: bun install
      - name: Catalog and local agent tests
        run: bun test library/catalog.test.ts library/handoff-core.test.ts library/native-patch.test.ts && node --test agent/engine.test.mjs agent/bridge.test.mjs tests/project-model.test.mjs tests/project-adapter.test.mjs tests/editor-geometry.test.mjs tests/footprint-preview.test.mjs tests/manual-route.test.mjs
      - name: Generate circuit and KiCad sources
        run: bun run build
      - name: Install pinned browser test runner
        run: |
          python3 -m venv /tmp/pcb-browser-venv
          /tmp/pcb-browser-venv/bin/pip install playwright==1.51.0
          /tmp/pcb-browser-venv/bin/playwright install --with-deps chromium
      - name: Real Chromium editor interactions
        run: /tmp/pcb-browser-venv/bin/python tests/browser_editor.py
      - name: Check browser module syntax
        run: node --check site/app.js && node --check site/catalog.js && node --check site/handoff-entry.js && node --check site/editor.js && node --check site/project-model.js && node --check site/editor-graphics.js && node --check site/editor-geometry.js && node --check site/footprint-preview.js && node --check site/route-geometry.js
      - name: Prepare safe public preview (no draft order files)
        if: success() && github.event_name != 'pull_request'
        run: |
          touch dist/.nojekyll
      - name: Upload Pages artifact
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pcb-workbench-pages
      cancel-in-progress: false
    steps:
      - name: Detect configured Pages site
        id: configure
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Deploy verified preview
        if: steps.configure.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Pages setup notice
        if: steps.configure.outcome != 'success'
        run: echo "Enable GitHub Pages > Source > GitHub Actions in repository settings, then rerun."
