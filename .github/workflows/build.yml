name: Build and verify PCB Workbench
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check local agent syntax
        run: node --check agent/server.mjs && node --check agent/engine.mjs && node --check agent/bridge.mjs
      - name: Install circuit engine
        run: bun install
      - name: Catalog and local agent tests
        run: bun test library/catalog.test.ts library/handoff-core.test.ts library/native-patch.test.ts && node --test agent/engine.test.mjs agent/bridge.test.mjs
      - name: Generate circuit and KiCad sources
        run: bun run build
      - name: Install official KiCad 10 stable packages
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
      - name: Independent verification and draft manufacturing exports
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/fabricate.py dist
      - name: Check browser module syntax
        run: node --check site/app.js && node --check site/catalog.js && node --check site/handoff-entry.js
      - name: Upload DRAFT outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcb-workbench-DRAFT-DO-NOT-ORDER
          path: dist/
          if-no-files-found: warn
      - name: Prepare safe public preview (no draft order files)
        if: success() && github.event_name != 'pull_request'
        run: |
          find dist/projects -type d -name draft -prune -exec rm -rf {} +
          touch dist/.nojekyll
      - name: Upload Pages artifact
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pcb-workbench-pages
      cancel-in-progress: false
    steps:
      - name: Detect configured Pages site
        id: configure
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Deploy verified preview
        if: steps.configure.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Pages setup notice
        if: steps.configure.outcome != 'success'
        run: echo "Enable GitHub Pages > Source > GitHub Actions in repository settings, then rerun."
