name: Manufacturing export verification
on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'library/catalog.json'
      - 'library/parts.tsx'
      - 'library/footprints.ts'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'site/route-geometry.js'
      - 'site/footprint-preview.js'
      - 'site/project-model.js'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/manufacturing.yml'
  pull_request:
    paths:
      - 'projects/**'
      - 'library/catalog.json'
      - 'library/parts.tsx'
      - 'library/footprints.ts'
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'site/route-geometry.js'
      - 'site/footprint-preview.js'
      - 'site/project-model.js'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/manufacturing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manufacture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Install circuit engine
        run: bun install
      - name: Generate circuit, schematic and PCB sources
        run: bun run build
      - name: Install official KiCad 10 stable packages
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
      - name: Independently verify and generate draft JLCPCB files
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 scripts/fabricate.py dist
      - name: Verify independent DRC rejects intentionally invalid copies
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m scripts.negative_drc dist projects/native-resistors-manual/project.json
      - name: Independently verify opt-in obstacle routing on four generic designs
        env:
          QT_QPA_PLATFORM: offscreen
          PCBWB_OBSTACLE_ROUTER: '1'
        run: |
          set -euo pipefail
          mkdir -p obstacle-verification
          for fixture in projects/native-resistors-mixed/native.json projects/native-rc-mixed/native.json tests/fixtures/obstacle-detour.json tests/fixtures/obstacle-multi.json; do
            name=$(basename "$(dirname "$fixture")")
            if [[ "$fixture" == tests/* ]]; then name=$(basename "$fixture" .json); fi
            bun run build --project-json "$fixture"
            test -s dist-native/projects/native/obstacle-route-candidate.json
            if [[ "$name" == obstacle-detour ]]; then
              node --input-type=module -e 'import fs from "node:fs"; import {validateTopResult} from "./scripts/obstacle-solver.js"; const input=JSON.parse(fs.readFileSync("dist-native/projects/native/autorouter-input.json")); const result=JSON.parse(fs.readFileSync("dist-native/projects/native/obstacle-route-candidate.json")); const route=input.connections[0].pointsToConnect.map(p=>({...p,width:result.candidate.width,route_type:"wire"})); let blocked=false; try {validateTopResult(input,{traces:[{type:"pcb_trace",route}]})} catch(e){if(!String(e).includes("copper clearance"))throw e;blocked=true} if(!blocked||result.candidate.segments<2)throw Error("Detour fixture did not require obstacle avoidance");'
            fi
            if [[ "$name" == obstacle-multi ]]; then
              node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync(process.argv[1])); const r=JSON.parse(fs.readFileSync("dist-native/projects/native/obstacle-route-candidate.json")); assert.deepEqual(r.candidates.map(c=>c.name),["RETURN","AUX_A","AUX_B"]); assert.deepEqual(r.project.routes.slice(0,p.routes.length),p.routes); assert.equal(r.project.routes.length,p.routes.length+3); assert.equal(r.orderReady,false);' "$fixture"
            fi
            python3 scripts/fabricate.py dist-native dist-native/input-projects
            cp -r dist-native/projects/native "obstacle-verification/$name"
          done
      - name: Verify opt-in two-layer automatic vias and independent drill parity
        env:
          QT_QPA_PLATFORM: offscreen
          PCBWB_OBSTACLE_ROUTER: '1'
          PCBWB_OBSTACLE_TWO_LAYER: '1'
        run: |
          set -euo pipefail
          bun run build --project-json tests/fixtures/obstacle-two-layer.json
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync("tests/fixtures/obstacle-two-layer.json")); const r=JSON.parse(fs.readFileSync("dist-native/projects/native/obstacle-route-candidate.json")); assert.equal(r.candidates.length,1); assert.equal(r.candidate.name,"RETURN"); assert.ok(r.candidate.vias>=2 && r.candidate.vias%2===0); assert.deepEqual(r.project.routes.slice(0,p.routes.length),p.routes); assert.equal(r.orderReady,false); const summary=JSON.parse(fs.readFileSync("dist-native/projects/native/project.json")); assert.equal(summary.expectedViaDrills.length,r.candidate.vias); assert.ok(summary.expectedViaDrills.every(v=>v.drill===.3));'
          python3 scripts/fabricate.py dist-native dist-native/input-projects
          cp -r dist-native/projects/native obstacle-verification/obstacle-two-layer
      - name: Verify multiple forced-via nets with optional reverse-order recovery
        env:
          QT_QPA_PLATFORM: offscreen
          PCBWB_OBSTACLE_ROUTER: '1'
          PCBWB_OBSTACLE_TWO_LAYER: '1'
          PCBWB_OBSTACLE_REVERSE_RETRY: '1'
        run: |
          set -euo pipefail
          bun run build --project-json tests/fixtures/obstacle-two-layer-multi.json
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync("tests/fixtures/obstacle-two-layer-multi.json")); const r=JSON.parse(fs.readFileSync("dist-native/projects/native/obstacle-route-candidate.json")); assert.deepEqual(r.candidates.map(c=>c.name),["RETURN","RETURN_B"]); assert.ok(r.candidates.every(c=>c.vias>=2 && c.vias%2===0)); assert.deepEqual(r.project.routes.slice(0,p.routes.length),p.routes); assert.equal(r.project.routes.length,p.routes.length+2); assert.equal(r.orderReady,false); const s=JSON.parse(fs.readFileSync("dist-native/projects/native/project.json")); assert.equal(s.expectedViaDrills.length,r.candidates.reduce((n,c)=>n+c.vias,0)); assert.ok(s.expectedViaDrills.every(v=>v.drill===.3));'
          python3 scripts/fabricate.py dist-native dist-native/input-projects
          cp -r dist-native/projects/native obstacle-verification/obstacle-two-layer-multi
      - name: Verify KiCad copper zone refill and export on two generic designs
        env:
          QT_QPA_PLATFORM: offscreen
          PCBWB_ZONE_FILL: '1'
        run: |
          set -euo pipefail
          mkdir -p zone-verification
          for id in native-resistors-manual native-rc-manual; do
            node --input-type=module -e 'import fs from "node:fs";const p=JSON.parse(fs.readFileSync("projects/"+process.argv[1]+"/native.json"));p.zones=[{id:"Z1",net:p.nets[1].name,layer:"top",clearance:.25,bounds:{xMin:-8,yMin:-6,xMax:8,yMax:6}}];fs.writeFileSync("/tmp/zone-fixture.json",JSON.stringify(p));' "$id"
            bun run build --project-json /tmp/zone-fixture.json
            python3 scripts/fabricate.py dist-native dist-native/input-projects
            node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const s=JSON.parse(fs.readFileSync("dist-native/projects/native/project.json"));assert.equal(s.status,"draft");assert.equal(s.orderReady,false);assert.equal(s.zoneParity.length,1);assert.equal(s.zoneParity[0].layer,"F.Cu");assert.ok(s.zoneParity[0].polygonAreaMm2>1);'
            cp -r dist-native/projects/native "zone-verification/$id"
          done
      - name: Verify four disjoint copper zones with automatic plated vias
        env:
          QT_QPA_PLATFORM: offscreen
          PCBWB_ZONE_FILL: '1'
          PCBWB_OBSTACLE_ROUTER: '1'
          PCBWB_OBSTACLE_TWO_LAYER: '1'
          PCBWB_OBSTACLE_REVERSE_RETRY: '1'
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs";const p=JSON.parse(fs.readFileSync("tests/fixtures/obstacle-two-layer-multi.json"));const z=(id,net,layer,yMin,yMax)=>({id,net,layer,clearance:.25,bounds:{xMin:-3.8,xMax:3.8,yMin,yMax}});p.zones=[z("Z1","SUPPLY","top",-14.5,-1),z("Z2","SUPPLY_B","top",1,14.5),z("Z3","RETURN","bottom",-14.5,-1),z("Z4","RETURN_B","bottom",1,14.5)];fs.writeFileSync("/tmp/zone-via-fixture.json",JSON.stringify(p));'
          bun run build --project-json /tmp/zone-via-fixture.json
          python3 scripts/fabricate.py dist-native dist-native/input-projects
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const s=JSON.parse(fs.readFileSync("dist-native/projects/native/project.json"));assert.equal(s.status,"draft");assert.equal(s.orderReady,false);assert.equal(s.expectedViaDrills.length,4);assert.ok(s.expectedViaDrills.every(v=>v.drill===.3));assert.ok(s.drillParity);assert.deepEqual(s.zoneParity.map(z=>[z.id,z.net,z.layer]).sort(),[["Z1","/SUPPLY","F.Cu"],["Z2","/SUPPLY_B","F.Cu"],["Z3","/RETURN","B.Cu"],["Z4","/RETURN_B","B.Cu"]]);assert.ok(s.zoneParity.every(z=>z.polygonAreaMm2>1));console.log(JSON.stringify({zoneParity:s.zoneParity,drillParity:s.drillParity}));'
          cp -r dist-native/projects/native zone-verification/disjoint-zones-vias
      - name: Verify same-origin HTTP manufacturing for two independent designs
        run: PYTHONPATH=. python3 tests/manufacturing_http_smoke.py
      - name: Upload draft manufacturing files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcb-workbench-DRAFT-DO-NOT-ORDER
          path: |
            dist/projects/*/draft/
            dist/projects/*/validation.json
            dist/projects/*/erc.json
            dist/projects/*/drc.json
            obstacle-verification/**
            zone-verification/**
            dist-native/projects/native/**
          if-no-files-found: warn
