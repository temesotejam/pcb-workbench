<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCB Workbench – 新規設計</title><link rel="stylesheet" href="style.css"><style>
.editor{display:block;max-width:1200px;margin:auto;padding:20px}.editor section{background:var(--panel);padding:16px;margin:14px 0;border:1px solid var(--line);border-radius:8px;overflow:auto}.editor form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.editor input{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:8px;font:inherit}.editor input[type=number]{width:90px}.editor select{width:auto;margin:0}.editor label{display:grid;gap:5px}.editor table{border-collapse:collapse;width:100%}.editor h2{margin-top:0}.editor td form{flex-wrap:nowrap}.editor #diagnostics{white-space:pre-wrap}.editor button:disabled{opacity:.5}
</style></head><body><header><strong>PCB Workbench · 独立設計</strong><a href="index.html">既存ビューアへ</a></header>
<main class="editor"><p class="notice">論理接続・配置の初期エディタです。実フットプリント、配線、ERC/DRC、製造データはまだ生成しません。発注不可。</p>
<p id="status" role="status">部品情報を読み込み中…</p><div id="controls" hidden>
<section><h2>プロジェクト</h2><form id="board-form"><label>名前<input id="project-name" required maxlength="100"></label><label>幅 mm<input id="width" type="number" min="1" max="1000" step="any" required></label><label>高さ mm<input id="height" type="number" min="1" max="1000" step="any" required></label><button>更新</button><button id="new" type="button">新規作成</button><button id="export" type="button">JSON保存</button><label>JSON読込<input id="import" type="file" accept=".json,application/json"></label></form></section>
<section><h2>部品（登録済み抵抗・コンデンサ）</h2><form id="add-component"><label>部品<select id="part"></select></label><button>追加</button></form><p>カタログの型番・在庫・フットプリントは製造前に別途検証が必要です。座標は mm、PCB原点は基板中心。</p><div id="components"></div></section>
<section><h2>ネット・ピン接続</h2><form id="add-net"><label>ネット名<input id="net-name" required pattern="[A-Za-z][A-Za-z0-9_]{0,63}"></label><button>追加</button></form><div id="nets"></div></section>
<section><h2>論理検査（ERC/DRCではありません）</h2><div id="diagnostics"></div></section></div></main><script type="module" src="editor.js"></script></body></html>
