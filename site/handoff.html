<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PCB Workbench · EasyEDA引き継ぎ</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="handoff.css"></head><body><header><div><strong>PCB Workbench</strong><span>EasyEDA Pro · private import</span></div><a href="./">Workbench</a></header><div class="importbar"><label>引き継ぎZIP（ブラウザ内処理） <input id="archive" type="file" accept=".zip,application/zip"></label><p id="status" role="status">ZIPを選択してください。ファイルは外部に送信しません。</p></div><main id="workspace" hidden><aside><label>基板 <select id="board"></select></label><h2>Import validation</h2><div id="metrics"></div><p class="notice">閲覧・照合用。発注不可。既存CADの検証記録であり、独立した再検証ではありません。</p><button id="report">検証レポートJSON</button></aside><section class="work"><div class="bar"><h1 id="title"></h1></div><nav id="nav"><button data-tab="pcb" aria-pressed="true">PCB原図</button><button data-tab="routes" aria-pressed="false">配線・レイヤー</button><button data-tab="schematic" aria-pressed="false">回路図</button><button data-tab="parts" aria-pressed="false">部品</button><button data-tab="pins" aria-pressed="false">端子</button><button data-tab="nets" aria-pressed="false">ネット</button><button data-tab="reports" aria-pressed="false">検証</button></nav><div id="handoff-tools" class="bar"><input id="filter" placeholder="Ref / C番号 / Net / 型番"><select id="sheet" hidden></select><select id="layer" hidden></select><button id="minus">−</button><button id="plus">＋</button></div><div id="panel" aria-live="polite"></div></section></main><footer>Private local import · no upload · no ordering</footer><script type="module" src="handoff.js"></script></body></html>
